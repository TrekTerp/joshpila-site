name: Publish Josh Pila website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TrekTerp/SkyWatcher
          ref: 954ac57ae6911849ccd093b8ffd8a40d7a60ebbb
          path: skywatcher-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm run check:astronomy && pnpm run check:cocktail-import && pnpm run check:backend && pnpm run build && pnpm run check:cocktails && pnpm run check:orrery
        working-directory: website
      - run: node website/scripts/assemble-pages.mjs && node website/scripts/check-section-icons.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
