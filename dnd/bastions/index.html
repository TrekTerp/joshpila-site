      rooms: [
        room(g, 'Grounds', 'grounds', grounds),
        room(g, 'Outbuilding', 'room', rect(3, 5, 8, 9)),
        room(g, 'Kitchen', 'room', rect(11, 14, 2, 5)),
        room(g, 'Stair room', 'room', rect(15, 16, 2, 5)),
        room(g, 'North-west room', 'room', rect(11, 13, 6, 10)),
        room(g, 'North-east room', 'room', rect(15, 16, 7, 10)),
        room(g, 'Central hall', 'hall', rect(12, 16, 11, 17).concat(rect(14, 14, 6, 10), rect(17, 25, 11, 11))),
        room(g, 'West hall', 'room', rect(2, 5, 11, 17)),
        room(g, 'Middle room, north', 'room', rect(6, 11, 11, 13)),
        room(g, 'West passage', 'hall', rect(6, 11, 14, 14)),
        room(g, 'Middle room, south', 'room', rect(6, 11, 15, 17)),
        room(g, 'East room', 'room', rect(17, 21, 12, 17)),
        room(g, 'Far east room', 'room', rect(22, 25, 12, 17)),
        room(u, 'Upper hall', 'hall', rect(2, 25, 11, 11).concat(rect(11, 11, 2, 10), rect(12, 16, 2, 3), rect(11, 11, 12, 17), rect(16, 16, 12, 17))),
        room(u, 'Gallery', 'void', rect(12, 15, 12, 17)),
        room(u, 'North room', 'room', rect(12, 16, 4, 7)),
        room(u, 'North small room', 'room', rect(12, 16, 8, 10)),
        room(u, 'West chamber', 'room', rect(2, 5, 12, 17)),
        room(u, 'West great chamber', 'room', rect(6, 10, 12, 17)),
        room(u, 'East chamber', 'room', rect(17, 19, 12, 17)),
        room(u, 'Middle east chamber', 'room', rect(20, 22, 12, 17)),
        room(u, 'Far east chamber', 'room', rect(23, 25, 12, 17)),
        ...P.cellarRooms(room),
        ...P.atticRooms(room),

      alloc: {},
      walls: { built: [], planned: [], queued: {} },
      marks: P.manorMarks(),
      manorRev: 2,
      v: 1,

  };

  /** Fill in what older saves of the manor lack: room traits, doors/windows/stairs, cave passages as a passage. */
  P.dressManor = (plan) => {
    let changed = false;
    for (const rm of plan.rooms) {
      const t = (P.MANOR_TAGS[rm.floor] || {})[rm.name];
      if (t && !rm.tags) { rm.tags = t.slice(); changed = true; }
      if (rm.floor === 'cellar' && rm.name === 'Cave passages' && rm.kind === 'cave') { rm.kind = 'hall'; changed = true; }

  /* ---------- queries ---------- */
  P.floor = (plan, id) => plan.floors.find((f) => f.id === id);

  /** Squares already used on a floor, from the point of view of `key`: the manor's basics give way to everything else. */
  P.takenFor = (s, plan, floorId, key) => {

  };
  P.HOUSE_BASICS = [
    { type: 'Kitchen', size: 'roomy', name: 'Kitchen', at: ['ground', 'Kitchen'] },
    { type: 'Dining Room', size: 'roomy', name: 'Dining room', at: ['ground', 'Middle room, north'] },
    { type: 'Parlor', size: 'roomy', name: 'Parlor', at: ['ground', 'West hall'] },
    { type: 'Storage', size: 'roomy', name: 'Cellar store', at: ['cellar', 'North store'] },
    { type: 'Storage', size: 'cramped', name: 'Pantry', at: ['ground', 'Stair room'] },

    { type: 'Bedroom', size: 'cramped', name: 'North bedroom', at: ['upper', 'North small room'] },
    { type: 'Bedroom', size: 'cramped', name: 'Cellar bedroom', at: ['cellar', 'Cellar bedroom'] },
  ];

  P.seedHouse = (s, bastionId, newId) => {
    const b = s.bastions[bastionId], plan = s.plans && s.plans[bastionId];

    s.meta.houseBasicsSeeded = true;

    const n = { roomy: 0, cramped: 0 };

      b.basics.push({ id, type: hb.type, size: hb.size, ownerId: null, name: hb.name, free: true, house: true, chosenBy });
      const rm = plan.rooms.find((r) => r.floor === hb.at[0] && r.name === hb.at[1]);

      const cells = P.compactBlock(new Set(rm.cells.filter((k) => !taken.has(k))), R.SPACE[hb.size].squares, []);

      for (const x of list) if (!x.chosenBy || !b.ownerIds.includes(x.chosenBy)) { x.chosenBy = left.shift() || null; changed = true; }
    }
    return changed;

<script>
/* Dragon's Bane Bastions — storage adapters.
 * Every adapter offers the same surface:
 *   kind, label, canWrite, load() -> {state, turns}, saveState(state), addTurn(turn), removeTurn(id), subscribe(onState) -> unsubscribe
 * - ClaudeStore: the claude.ai artifact's shared database (one state doc + one doc per turn).
 * - LocalStore: this browser only (a fallback, and for public hosting before a backend exists).
 * A hosted backend (Supabase, Firebase, a tiny API) slots in later with the same five methods.
 */
(function (root) {
  'use strict';
  const LS = {
    get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };
  root.BLS = LS;

  function LocalStore(prefix) {
    prefix = prefix || 'dbb';
    return {
      kind: 'local', label: 'This browser only', canWrite: true,
      async load() { return { state: LS.get(prefix + '.state'), turns: LS.get(prefix + '.turns') || [] }; },
      async saveState(s) { if (!LS.set(prefix + '.state', s)) throw new Error('Browser storage is unavailable or full.'); },
      async addTurn(t) { const all = LS.get(prefix + '.turns') || []; all.push(t); if (!LS.set(prefix + '.turns', all)) { all.forEach((x) => { if (x !== t) delete x.before; }); LS.set(prefix + '.turns', all); } },
      async removeTurn(id) { LS.set(prefix + '.turns', (LS.get(prefix + '.turns') || []).filter((t) => t.id !== id)); },
      subscribe() { return () => {}; },
    };
  }

  function ClaudeStore(db, canWrite) {
    const stateRef = db.doc('bastion/state');
    const turns = db.collection('turns');
    let lastWritten = null;
    const canon = (v) => Array.isArray(v) ? '[' + v.map(canon).join(',') + ']' : (v && typeof v === 'object') ? '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}' : JSON.stringify(v);
    let chain = Promise.resolve();
    const serial = (fn) => (chain = chain.then(fn, fn));
    return {
      kind: 'claude', label: window.CODEX_SITE ? 'Shared with the table' : 'Shared on claude.ai', canWrite,
      async load() {
        const snap = await stateRef.get();
        const q = await turns.orderBy('n', 'asc').get();
        const list = q.docs.map((d) => { const t = JSON.parse(JSON.stringify(d.data())); if (typeof t.before === 'string') { try { t.before = JSON.parse(t.before); } catch (e) { t.before = null; } } return t; });
        return { state: snap.exists && snap.data().state ? JSON.parse(JSON.stringify(snap.data().state)) : null, turns: list };
      },
      saveState(s) { return serial(async () => { lastWritten = canon(s); await stateRef.set({ state: s, at: new Date().toISOString() }); }); },
      addTurn(t) { return serial(async () => { const body = Object.assign({}, t, { before: t.before ? JSON.stringify(t.before) : null }); await turns.doc(t.id).set(body); }); },
      removeTurn(id) { return serial(() => turns.doc(id).delete()); },
      subscribe(onState) {
        return stateRef.onSnapshot((snap) => {
          if (!snap.exists || snap.metadata.hasPendingWrites) return;
          const s = snap.data().state;
          if (s && canon(s) !== lastWritten) onState(JSON.parse(JSON.stringify(s)));
        }, () => {});
      },
    };
  }

  root.BS = { LocalStore, ClaudeStore };
})(typeof window !== 'undefined' ? window : globalThis);

      ENV.canWrite = ENV.isOwner || canW === true || (canW === null && user ? await withTimeout(user.canEdit(), 5000, false) : false);

      if (!ENV.isOwner && PREFS.role.kind === 'dm') { PREFS.role = { kind: 'player', oid: null }; }
    } else if (window.CODEX_SITE && (CODEX_SITE.state === 'out' || CODEX_SITE.state === 'guest')) {
      ENV.ready = true;
      const out = CODEX_SITE.state === 'out';
      document.getElementById('app').replaceChildren(h('div', { class: 'gate' },
        h('div', { class: 'gate-links' }, CODEX_SITE.header()),
        h('h1', null, 'Dragon’s Bane Bastions'),
        h('p', null, out ? 'The manor’s plans, facilities and orders are kept for the table. Sign in with the email Josh has on the list; you’ll get a six-digit code, no password.'
                         : 'You’re signed in, but that email isn’t on the table list yet. Ask Josh to add it, then reload.'),
        out ? h('button', { class: 'btn primary', 'data-acctopen': '1' }, 'Sign in') : null));

    } else STORE = BS.LocalStore('dbb');
    const failed = { failed: true };
    let loaded = await withTimeout(STORE.load(), 15000, failed);
    if (!loaded || loaded.failed) { toast('Could not reach the saved data; showing this browser’s last copy.'); loaded = { state: LS.get('dbb.backup'), turns: [] }; }
    S = loaded.state ? E.migrate(loaded.state) : (window.BASTIONS_SEED ? E.migrate(JSON.parse(JSON.stringify(window.BASTIONS_SEED))) : E.seed());
    TURNS = loaded.turns || [];
    if (!loaded.state && ENV.canWrite) save();
    if (PREFS.role.kind === 'player' && !S.owners[PREFS.role.oid]) PREFS.role = ENV.mode === 'claude' && !ENV.isOwner ? { kind: 'player', oid: Object.keys(S.owners)[0] } : { kind: 'dm', oid: null };
    { const pc = window.CODEX_SITE && CODEX_SITE.pc; if (ENV.mode === 'claude' && !ENV.isOwner && pc && S.owners[pc]) { PREFS.role = { kind: 'player', oid: pc }; ENV.pcLocked = true; } }
    try { UNSUB = STORE.subscribe(async (ns) => { S = E.migrate(ns); try { TURNS = (await STORE.load()).turns || TURNS; } catch (e) { /* keep */ } render(); }); } catch (e) { /* live updates are optional */ }

    render();

    withTimeout(fetch('art/manifest.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)), 8000, null).then((m) => { if (m) { ART = m; render(); } });
  }
  let booted = false;
  const start = () => { if (booted) return; booted = true; boot().catch((e) => showBootError(e && (e.stack || e.message) || e)); };

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') { try { hot.ready(start); } catch (e) { /* fall through */ } }

  setTimeout(start, 1500);
})();
