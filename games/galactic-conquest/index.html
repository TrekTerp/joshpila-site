<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Galactic Conquest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Classic = one 80x25 DOS screen in a monitor bezel. Modern = top bar, starmap filling the stage, order sidebar on the right (stacks under the map on phones). Deliberately single-theme dark: it is space. */
:root {
  --desk: #0c0e13;
  --bezel: #1b1e26;
  --bezel-edge: #2a2f3b;
  --bezel-focus: #3d4658;
  --screen: #000000;
  --hint: #6c7284;
  --crt-accent: #55ffff;

  --space: #060911;
  --panel: rgba(13, 18, 32, .9);
  --panel-solid: #0d1220;
  --field: #0a0f1c;
  --line: #1c2540;
  --line-2: #2a3656;
  --text: #e6ebf6;
  --muted: #8a94ad;
  --faint: #5a6480;
  --danger: #ff8a7e;
  --accent: #cdd6ff;
  --on-accent: #05070d;
  --scrim: rgba(3, 5, 10, .62);

  --font-crt: 'VT323', ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
  --font-display: 'Chakra Petch', 'Bahnschrift', 'Segoe UI', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  background: var(--desk);
  color: var(--hint);
  font-family: var(--font-crt);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.modern-mode { background: var(--space); color: var(--text); font-family: var(--font-body); padding-block: 10px; }

/* ---------- classic ---------- */
#classic { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.monitor {
  position: relative;
  width: min(100%, calc((100vh - 130px) * 1.8 + 28px));
  max-width: 1240px;
  padding: 14px;
  background: var(--bezel);
  border: 1px solid var(--bezel-edge);
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .05);
  transition: border-color .2s;
}
.monitor.focused { border-color: var(--bezel-focus); }
#scr { display: block; width: 100%; height: auto; max-width: 100%; background: var(--screen); border-radius: 6px; cursor: text; touch-action: manipulation; }
.monitor::after {
  content: ""; position: absolute; inset: 14px; border-radius: 6px; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 62%, rgba(0, 0, 0, .35) 100%);
}
#kbd { position: absolute; left: 14px; top: 14px; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; caret-color: transparent; }
.caption { margin: 0; font-size: 19px; line-height: 1.25; letter-spacing: .02em; text-align: center; max-width: 72ch; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; align-items: center; }
.caption b { color: var(--crt-accent); font-weight: normal; }
.crt-btn { font-family: var(--font-crt); font-size: 19px; color: var(--crt-accent); background: transparent; border: 1px solid var(--bezel-edge); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.crt-btn:hover { border-color: var(--crt-accent); }
.crt-btn:focus-visible { outline: 2px solid var(--crt-accent); outline-offset: 2px; }

/* ---------- modern shell ---------- */
#modern { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
.topbar { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--text); }
.turninfo { font-family: var(--font-display); font-weight: 500; font-size: 14px; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; min-height: 0; }
#modern.noside .stage { grid-template-columns: minmax(0, 1fr); }
#modern.noside .side { display: none; }
.mapwrap { position: relative; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--space); }
#map { display: block; width: 100%; height: 100%; touch-action: none; }
.tip {
  position: absolute; pointer-events: none; z-index: 3;
  background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 6px 10px; font-size: 13px; line-height: 1.35; color: var(--text); white-space: nowrap;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
}
.ticker { position: absolute; left: 0; right: 0; bottom: 10px; overflow: hidden; pointer-events: none; z-index: 2; }
.ticker span { display: inline-block; white-space: nowrap; font-family: var(--font-crt); font-size: 22px; color: #ffe27a; opacity: .75; padding-left: 100%; animation: crawl 14s linear forwards; }
@keyframes crawl { to { transform: translateX(-100%); } }

.side {
  min-height: 0; min-width: 0; overflow: auto;
  display: flex; flex-direction: column; gap: 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px;
}
.side section { display: flex; flex-direction: column; gap: 8px; }
.side h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .04em; text-wrap: balance; }
.side h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.count { font-family: var(--font-body); font-weight: 600; letter-spacing: 0; color: var(--faint); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; line-height: 1.4; }
.side p { margin: 0; }
.who { display: grid !important; grid-template-columns: auto 1fr; align-items: center; column-gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.who .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.who-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .08em; }
.order { background: var(--field); border: 1px solid var(--line-2); border-radius: 12px; padding: 14px; }
.order h3 { color: var(--text); font-size: 13px; }
.kind { margin-left: auto; font-family: var(--font-body); font-weight: 600; letter-spacing: .04em; text-transform: none; font-size: 13px; color: var(--accent); }
.shiprow { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 10px; align-items: center; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { flex: 1; padding: 6px 0; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .primary { flex: 1; }
.fb { min-height: 1.3em; font-size: 14px; color: var(--muted); }
.fb.bad { color: var(--danger); }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
ul.list li { display: flex; align-items: center; gap: 8px; font-size: 15px; font-variant-numeric: tabular-nums; padding: 3px 0; }
ul.list .eta { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .06em; color: var(--muted); min-width: 32px; }
ul.list .n { font-weight: 600; min-width: 40px; text-align: right; }
ul.list .x { margin-left: auto; padding: 2px 10px; font-size: 12px; }
table.ptable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.ptable th { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); text-align: right; padding: 0 4px 6px; }
.ptable th:first-child, .ptable td:first-child { text-align: left; }
.ptable td { text-align: right; padding: 5px 4px; border-top: 1px solid var(--line); }
.ptable tr[data-sel] { cursor: pointer; }
.ptable tr[data-sel]:hover td { background: rgba(255, 255, 255, .03); }
.ptable .home { color: var(--accent); font-size: 12px; margin-left: 4px; }
.sidefoot { margin-top: auto; display: flex; gap: 10px; position: sticky; bottom: -16px; padding-block: 14px 16px; margin-bottom: -16px; background: linear-gradient(to bottom, transparent, var(--panel-solid) 35%); }
.sidefoot > .primary { flex: 1; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.facts div { background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.facts dt { font-family: var(--font-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.facts dd { margin: 2px 0 0; font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }

/* letters, chips */
.pl {
  display: inline-grid; place-items: center; min-width: 1.25em; height: 1.1em; padding: 0 .18em;
  font-family: var(--font-crt); font-size: 21px; line-height: 1; border-radius: 4px;
  background: var(--pc, #262c3d); color: var(--pt, #c8cedb); vertical-align: middle;
}
.pchip { font-family: var(--font-display); font-weight: 700; letter-spacing: .06em; color: var(--pc); }
.loss { color: var(--danger); font-weight: 600; }

/* controls */
#modern button, .overlay button {
  font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .05em;
  color: var(--text); background: #141b2e; border: 1px solid var(--line-2); border-radius: 8px;
  padding: 9px 14px; cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
}
#modern button:hover, .overlay button:hover { border-color: #3c4b75; }
#modern button:active, .overlay button:active { transform: translateY(1px); }
#modern button.primary, .overlay button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
#modern button.primary:hover, .overlay button.primary:hover { filter: brightness(1.08); }
#modern button.ghost, .overlay button.ghost { background: transparent; }
#modern button:disabled { opacity: .45; cursor: default; }
#modern :focus-visible, .overlay :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; }
#modern .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 7px 13px; }
#modern .seg button[aria-pressed="true"] { background: var(--line-2); color: var(--text); }
input[type="text"], input[type="number"] {
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text); background: var(--field); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"], input[type="checkbox"] { accent-color: var(--accent); }
input[type="range"] { width: 100%; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: var(--scrim); backdrop-filter: blur(3px);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dialog {
  width: min(560px, 100%); max-height: 100%; overflow: auto;
  background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 18px;
  padding: 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  display: flex; flex-direction: column; gap: 16px;
}
.dialog.wide { width: min(680px, 100%); }
.dialog h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 7vw, 54px); line-height: .95; letter-spacing: .07em; text-transform: uppercase; text-wrap: balance; }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .04em; text-wrap: balance; }
.dialog h3 { margin: 4px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.dialog p { margin: 0; max-width: 62ch; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); }
.resume { display: flex; align-items: center; gap: 14px; background: var(--field); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; }
.resume div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.resume span { color: var(--muted); font-size: 14px; }
form.setup { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .fieldlabel { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.field output { color: var(--text); font-family: var(--font-body); font-size: 15px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.stepper { display: inline-flex; align-items: center; gap: 12px; }
.stepper output { min-width: 1.5em; text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.overlay .stepper button { width: 38px; padding: 6px 0; font-size: 18px; }
.prows { display: flex; flex-direction: column; gap: 8px; }
.prow { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
.prow select { font: inherit; font-size: 14px; color: var(--text); background: var(--field); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 8px; max-width: 9.5em; }
.prow select:disabled { opacity: .35; }
@media (max-width: 540px) { .prow { grid-template-columns: 14px minmax(0, 1fr) auto; } .prow select { grid-column: 2 / -1; max-width: none; } }
.swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 10px var(--pc); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { width: 18px; height: 18px; }
ul.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ul.news li { padding: 8px 12px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
ul.news li.banner { border-color: var(--danger); background: rgba(255, 138, 126, .08); font-family: var(--font-display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--danger); }
.standings { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
table.final { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.final th { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); text-align: right; padding: 0 6px 8px; }
.final td { text-align: right; padding: 8px 6px; border-top: 1px solid var(--line); }
.final th:first-child, .final td:first-child { text-align: left; }
.final td.score { font-weight: 600; font-size: 18px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices label { position: relative; cursor: pointer; }
.choices input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.choices span { display: inline-block; padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--field); color: var(--muted); font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .04em; }
.choices input:checked + span { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.choices input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--faint); margin: 0; }
ul.list.rtlog li { display: block; font-size: 14px; line-height: 1.45; padding: 4px 0; border-top: 1px solid var(--line); }
ul.list.rtlog li:first-child { border-top: 0; }
ul.list.rtlog li .eta { display: inline-block; min-width: 34px; }
ul.list.rtlog li.banner { color: var(--danger); font-weight: 600; }
.helpgrid { display: grid; gap: 6px 14px; grid-template-columns: auto minmax(0, 1fr); font-size: 15px; }
.helpgrid dt { font-family: var(--font-display); font-weight: 600; color: var(--accent); white-space: nowrap; }
.helpgrid dd { margin: 0; color: var(--muted); }

@media (max-width: 900px) {
  body.modern-mode { height: auto; min-height: 100%; }
  #modern { height: auto; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { aspect-ratio: 16.4 / 10.4; max-width: 100%; }
  .side { overflow: visible; }
  .sidefoot { position: static; margin-bottom: 0; background: none; padding-block: 6px 0; }
  .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .ticker span { animation: none; padding-left: 16px; }
}
</style>

<body>
<div id="classic" hidden>
  <div class="monitor" id="monitor">
    <canvas id="scr" aria-label="Galactic Conquest classic text screen. Click, then type."></canvas>
    <input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Keyboard input">
  </div>
  <p class="caption"><span>Click the screen and type. At the <b>from planet?</b> prompt, enter <b>?</b> for help.</span><button type="button" class="crt-btn" id="toModern">Switch to modern view (F2)</button></p>
</div>

<div id="modern" hidden>
  <header class="topbar">
    <div class="brand">Galactic Conquest</div>
    <div class="turninfo" id="mTurn"></div>
    <div class="spacer"></div>
    <button type="button" class="ghost" id="mHelp">How to play</button>
    <div class="seg" role="group" aria-label="Display style">
      <button type="button" id="segClassic" data-mode="classic" aria-pressed="false">Classic</button>
      <button type="button" id="segModern" data-mode="modern" aria-pressed="true">Modern</button>
    </div>
  </header>
  <div class="stage">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Star map. Drag from one of your planets to another planet to send a fleet."></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="ticker" id="ticker" hidden><span>Look to Carol Alt for inspiration</span></div>
    </div>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="helpOverlay" hidden><div class="dialog wide" id="helpDialog" role="dialog" aria-modal="true" aria-label="How to play"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   SHARED ENGINE
   ===================================================================== */
const PCOL = [12, 9, 10, 14, 13, 11];
const GW = 16, GH = 10;
const SAVE_KEY = 'galcon-autosave-v1';
let S = null;
let lastEvents = [];
const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const travel = d => Math.max(1, Math.ceil(d / 2));
const kfmt = k => k.toFixed(2).replace(/^0/, '');
const pl = n => S.planets.find(p => p.name === n);
const nm = i => [S.players[i].name, PCOL[i], null, 'player' + i];
const plSeg = n => [n, 15, null, 'planet'];
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); const o = s ? JSON.parse(s) : null; return o && o.players && o.planets ? o : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

const TYPES = ['rocky', 'desert', 'ocean', 'ice', 'gas', 'lava', 'toxic', 'gas'];
const newLook = () => ({ type: TYPES[Math.floor(rnd() * TYPES.length)], seed: Math.floor(rnd() * 1e9), variant: Math.floor(rnd() * 16) });

const SHAPES = { scattered: 'Scattered', clusters: 'Clusters', spiral: 'Spiral', ring: 'Ring', fronts: 'Two fronts' };
const SHAPE_KEYS = Object.keys(SHAPES);
const SKILLS = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };
// Each shape scores every grid point 0..1; planets are dealt to the highest-scoring points (with some randomness).
function shapeFn(shape, total) {
  const cx = (GW - 1) / 2, cy = (GH - 1) / 2;
  if (shape === 'clusters') {

    if (prev < 0) news.push([nm(f.owner), [' has captured planet ', 7], plSeg(P.name), ['.', 7]]);
    else if (P.home === f.owner) news.push([nm(f.owner), [' has retaken home planet ', 7], plSeg(P.name), [' from ', 7], nm(prev), ['!', 7]]);
    else news.push([nm(f.owner), [' has conquered planet ', 7], plSeg(P.name), [' from ', 7], nm(prev), ['!', 7]]);
    if (prev >= 0 && P.home === prev) news.push([[` *** ${S.players[prev].name}'S HOME PLANET HAS FALLEN! *** `, 15, 4, 'banner']]);
  } else {
    P.ships = d + frac;
    if (prev < 0) news.push([['Neutral planet ', 7], plSeg(P.name), [' has held against ', 7], nm(f.owner), ['. ', 7], [`${f.ships} ships lost.`, 12, null, 'loss']]);
    else news.push([['Planet ', 7], plSeg(P.name), [' (', 7], nm(prev), [') has held against ', 7], nm(f.owner), ['. ', 7], [`${f.ships} ships lost.`, 12, null, 'loss']]);
  }
  return ev;
}
function revoltAt(P, news) {
  const o = P.owner;
  const [r, g] = fight(Math.ceil(P.prod * (1 + rnd() * 2)), 0.5, Math.floor(P.ships), P.kill);
  const ev = { kind: 'revolt', planet: P.name, before: o, success: r > 0 };
  lastEvents.push(ev);
  if (r > 0) { P.owner = -1; P.ships = r; setIntel(o, P.name, { ships: r, kill: P.kill, prod: P.prod }); news.push([['Planet ', 7], plSeg(P.name), [' has revolted against ', 7], nm(o), [' and declared independence!', 7]]); }
  else { P.ships = g + (P.ships - Math.floor(P.ships)); news.push([['A revolt on planet ', 7], plSeg(P.name), [' has been put down by ', 7], nm(o), ['.', 7]]); }
  return ev;
}
function eliminate(news) {
  S.players.forEach((p, i) => {
    if (!p.alive) return;
    if (!S.planets.some(x => x.owner === i) && !S.fleets.some(f => f.owner === i)) {
      p.alive = false; news.push([nm(i), [' has been driven from the galaxy!', 12, null, 'loss']]);
    }
  });
}
function resolve() {
  S.turn++;
  const news = []; lastEvents = [];
  const arriving = shuffle(S.fleets.filter(f => f.arrive <= S.turn));
  S.fleets = S.fleets.filter(f => f.arrive > S.turn);
  for (const f of arriving) battle(f, news);
  if (S.revolts) for (const P of S.planets) if (P.owner >= 0 && P.home !== P.owner && rnd() < 0.02) revoltAt(P, news);
  for (const P of S.planets) P.ships += P.owner >= 0 ? P.prod : 1;
  eliminate(news);
  return news;
}

/* ---------- real time: one "cycle" is a turn's worth of production and 2 light years of travel ---------- */
const RT_PERIOD = { slow: 4500, normal: 3000, fast: 2000 };   // milliseconds per cycle
const RT_AI_EVERY = { easy: 3, normal: 1.6, hard: 0.9 };      // cycles between computer decisions
const RT = { on: false, paused: false, last: null, saved: 0, sideAt: 0, events: [], finish: null };
function rtStep(now) {
  if (RT.last == null) { RT.last = now; return; }
  const dc = Math.max(0, Math.min(120, now - RT.last)) / RT_PERIOD[S.speed || 'normal'];
  RT.last = now;
  const prev = S.cyc; S.cyc += dc; S.turn = Math.floor(S.cyc) + 1;
  for (const P of S.planets) P.ships += P.owner >= 0 ? P.prod * dc : dc / 3;
  const news = []; lastEvents = [];
  const due = S.fleets.filter(f => S.cyc >= f.start + f.dur);
  if (due.length) { S.fleets = S.fleets.filter(f => S.cyc < f.start + f.dur); for (const f of due) battle(f, news); }
  if (S.revolts && Math.floor(S.cyc) > Math.floor(prev)) for (const P of S.planets) if (P.owner >= 0 && P.home !== P.owner && rnd() < 0.007) revoltAt(P, news);
  S.players.forEach((p, i) => {
    if (!p.alive || !p.ai) return;
    if (S.ai[i] == null) S.ai[i] = 0.4 + rnd() * 0.8;
    if (S.cyc >= S.ai[i]) { aiTurn(i); S.ai[i] = S.cyc + RT_AI_EVERY[S.skill || 'normal'] * (0.7 + 0.6 * rnd()); }
  });
  eliminate(news);
  if (news.length) rtNews(news, now);
  if (now - RT.saved > 3000) { save(); RT.saved = now; }
  if (now - RT.sideAt > 400) { rtLive(); RT.sideAt = now; }
  const alive = S.players.filter(p => p.alive);
  if (!S.players.some(p => p.alive && !p.ai)) RT.finish && RT.finish({ over: true, reason: 'Your empire has been driven from the galaxy.' });
  else if (alive.length <= 1) RT.finish && RT.finish({ over: true, reason: 'Only one empire remains.' });
}
function finalRows() {
  return S.players.map((p, i) => {
    const own = S.planets.filter(x => x.owner === i);
    const ships = Math.floor(own.reduce((a, x) => a + x.ships, 0) + S.fleets.filter(f => f.owner === i).reduce((a, f) => a + f.ships, 0));
    const avgK = own.length ? own.reduce((a, x) => a + x.kill, 0) / own.length : 0;
    return { i, p, planets: own.length, ships, avgK, score: Math.round(ships * avgK + 50 * own.length) };
  }).sort((a, b) => b.score - a.score);
}
function soleHuman() { const h = S.players.map((p, i) => (p.alive && !p.ai) ? i : -1).filter(i => i >= 0); return h.length === 1 ? h[0] : -1; }
function cleanName(s, i, taken) {
  let name = String(s || '').toUpperCase().replace(/[^A-Z0-9 .'\-]/g, '').trim().slice(0, 10);
  if (!name) name = `PLAYER ${i + 1}`;
  if (taken.includes(name)) name = (name.slice(0, 8) + ' ' + (i + 1)).trim();
  return name;
}

/* =====================================================================
   MODE SWITCHING
   ===================================================================== */
// The game always opens on the classic title screen; its first question offers the modern version.
let mode = 'classic';
class SwitchError extends Error {}
let pendingReject = null;
function setMode(m) {
  if (m === mode) return;
  mode = m;
  applyMode();
  if (pendingReject) { const r = pendingReject; pendingReject = null; waiter = null; r(new SwitchError()); }
}
function applyMode() {
  const modern = mode === 'modern';
  document.body.classList.toggle('modern-mode', modern);
  $('#classic').hidden = modern;
  $('#modern').hidden = !modern;
  closeDialog(); closeHelp();
  M.flow = null; V.replay = null;
  $('#segModern').setAttribute('aria-pressed', String(modern));
  $('#segClassic').setAttribute('aria-pressed', String(!modern));
  if (modern) { stopTicker(); gameScreen = false; requestAnimationFrame(() => { mResize(); startLoop(); }); }
  else { stopLoop(); dirty(); try { kbd.focus({ preventScroll: true }); } catch (e) {} }
}
async function run(name, ...args) {
  while (true) {
    try { return await (mode === 'modern' ? MUI : CUI)[name](...args); }
    catch (e) { if (!(e instanceof SwitchError)) throw e; }
  }
}

/* =====================================================================
   CLASSIC: 80x25 TEXT SCREEN
   ===================================================================== */
const COLS = 80, ROWS = 25, CW = 18, CH = 32, N = COLS * ROWS;
const PAL = ['#000000','#0000AA','#00AA00','#00AAAA','#AA0000','#AA00AA','#AA5500','#AAAAAA',
             '#555555','#5555FF','#55FF55','#55FFFF','#FF5555','#FF55FF','#FFFF55','#FFFFFF'];
const cv = $('#scr');
cv.width = COLS * CW; cv.height = ROWS * CH;
const ctx = cv.getContext('2d');
const FONT = `${CH - 2}px VT323, ui-monospace, Consolas, 'Courier New', monospace`;
let CHR = new Array(N).fill(' ');
const FG = new Uint8Array(N).fill(7), BG = new Uint8Array(N).fill(0);
let cx = 0, cy = 0, curF = 7, curB = 0, queued = false, blinkOn = true;
const BOX = {'─':'lr','│':'ud','┌':'rd','┐':'ld','└':'ru','┘':'lu','├':'udr','┤':'udl','┬':'lrd','┴':'lru'};
const pcolor = o => o < 0 ? 7 : PCOL[o];

function dirty() { if (!queued) { queued = true; requestAnimationFrame(draw); } }
function boxGlyph(x, y, d, col) {
  ctx.fillStyle = col;
  const t = 3, mx = x + CW / 2, my = y + CH / 2;
  if (d.includes('l')) ctx.fillRect(x, my - 1, CW / 2 + 1, t);
  if (d.includes('r')) ctx.fillRect(mx - 1, my - 1, CW / 2 + 1, t);
  if (d.includes('u')) ctx.fillRect(mx - 1, y, t, CH / 2 + 1);
  if (d.includes('d')) ctx.fillRect(mx - 1, my - 1, t, CH / 2 + 1);
}
function draw() {
  queued = false;
  if (mode !== 'classic') return;
  ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const k = r * COLS + c, x = c * CW, y = r * CH;
    ctx.fillStyle = PAL[BG[k]]; ctx.fillRect(x, y, CW, CH);
    const s = CHR[k]; if (s === ' ') continue;
    const col = PAL[FG[k]];
    if (BOX[s]) { boxGlyph(x, y, BOX[s], col); continue; }
    if (s === '·') { ctx.fillStyle = col; ctx.fillRect(x + CW / 2 - 2, y + CH / 2 - 1, 4, 4); continue; }
    ctx.fillStyle = col; ctx.fillText(s, x + CW / 2, y + CH / 2 + 1);
  }
  if (waiter && waiter.kind === 'line' && blinkOn) {
    const c = waiter.col + waiter.buf.length;
    if (c < COLS) { ctx.fillStyle = PAL[15]; ctx.fillRect(c * CW + 2, waiter.row * CH + CH - 7, CW - 4, 3); }
  }
}
function cls() { CHR.fill(' '); FG.fill(7); BG.fill(0); cx = 0; cy = 0; curF = 7; curB = 0; stopTicker(); gameScreen = false; dirty(); }
function put(r, c, s, f = curF, b = curB) {
  s = String(s);
  for (let i = 0; i < s.length; i++) {
    const cc = c + i;
    if (cc < 0 || cc >= COLS || r < 0 || r >= ROWS) continue;
    const k = r * COLS + cc; CHR[k] = s[i]; FG[k] = f; BG[k] = b;
  }
  dirty();
}
function fillRow(r, f, b) { put(r, 0, ' '.repeat(COLS), f, b); }
function center(r, s, f, b = 0) { put(r, Math.max(0, Math.floor((COLS - s.length) / 2)), s, f, b); }
function segs(r, c, arr) { let col = c; for (const [t, f, b] of arr) { put(r, col, t, f, b == null ? 0 : b); col += t.length; } return col; }
function segsLen(arr) { return arr.reduce((a, s) => a + s[0].length, 0); }
function scrollUp() {
  CHR.splice(0, COLS); for (let i = 0; i < COLS; i++) CHR.push(' ');
  FG.copyWithin(0, COLS); FG.fill(7, N - COLS); BG.copyWithin(0, COLS); BG.fill(0, N - COLS); dirty();
}
function newline() { cx = 0; cy++; if (cy >= ROWS) { scrollUp(); cy = ROWS - 1; } }
function print(s, f, b) {
  if (f != null) curF = f; if (b != null) curB = b;
  for (const c of String(s)) { if (c === '\n') { newline(); continue; } put(cy, cx, c); cx++; if (cx >= COLS) newline(); }
}
function println(s = '', f, b) { print(s, f, b); newline(); }
function locate(r, c) { cy = r; cx = c; }

let waiter = null;
function input(prompt = '', opts = {}) {
  if (prompt) print(prompt, opts.pf != null ? opts.pf : 7);
  const row = cy, col = cx;
  const max = Math.max(1, Math.min(opts.max || 30, COLS - col - 1));
  return new Promise((res, rej) => {
    pendingReject = rej;
    waiter = { kind: 'line', buf: '', row, col, max, nl: opts.nl !== false, f: opts.f != null ? opts.f : 15, res: v => { pendingReject = null; res(v); } };
    blinkOn = true; dirty();
  });
}
function waitKey() {
  return new Promise((res, rej) => { pendingReject = rej; waiter = { kind: 'key', res: v => { pendingReject = null; res(v); } }; });
}
function echo() { const w = waiter; put(w.row, w.col, w.buf + ' '.repeat(w.max - w.buf.length + 1), w.f, 0); }
function keyChar(c) {
  if (!waiter) return;
  if (waiter.kind === 'key') { const w = waiter; waiter = null; w.res(c); return; }
  if (c.length !== 1 || c < ' ') return;
  if (waiter.buf.length < waiter.max) { waiter.buf += c.toUpperCase(); blinkOn = true; echo(); }
}
function keyEnter() {
  if (!waiter) return;
  const w = waiter; waiter = null;
  if (w.kind === 'key') { w.res('\n'); return; }
  dirty();
  if (w.nl) { cy = w.row; cx = w.col + w.buf.length; newline(); }
  w.res(w.buf.trim());
}
function keyBack() { if (waiter && waiter.kind === 'line' && waiter.buf) { waiter.buf = waiter.buf.slice(0, -1); echo(); } }
function keyEsc() { if (!waiter) return; if (waiter.kind === 'line') { waiter.buf = ''; echo(); } else keyChar(' '); }
const IGNORE = new Set(['Shift','Control','Alt','Meta','CapsLock','Tab','NumLock','ScrollLock','Fn','OS']);
const kbd = $('#kbd'), monitor = $('#monitor');
document.addEventListener('keydown', e => {
  if (e.key === 'F2') { e.preventDefault(); setMode(mode === 'modern' ? 'classic' : 'modern'); return; }
  if (mode !== 'classic') { mKeydown(e); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && t !== kbd && (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.tagName === 'TEXTAREA')) return;
  if (e.isComposing || e.key === 'Unidentified' || e.keyCode === 229) return;
  if (e.key === 'Enter') { e.preventDefault(); keyEnter(); }
  else if (e.key === 'Backspace') { e.preventDefault(); keyBack(); }
  else if (e.key === 'Escape') { keyEsc(); }
  else if (e.key.length === 1) { e.preventDefault(); keyChar(e.key); }
  else if (waiter && waiter.kind === 'key' && !IGNORE.has(e.key)) { e.preventDefault(); keyChar(' '); }
});
kbd.addEventListener('input', () => { const v = kbd.value; kbd.value = ''; for (const c of v) { if (c === '\n') keyEnter(); else keyChar(c); } });
kbd.addEventListener('focus', () => monitor.classList.add('focused'));
kbd.addEventListener('blur', () => monitor.classList.remove('focused'));
cv.addEventListener('pointerdown', () => {
  try { kbd.focus({ preventScroll: true }); } catch (e) {}
  if (waiter && waiter.kind === 'key') keyChar(' ');
});
setInterval(() => { blinkOn = !blinkOn; if (waiter && waiter.kind === 'line') dirty(); }, 530);

let gameScreen = false, tick = null;
const HINT = ' ?=Help  ?N=Planet info  AN 20=Quick move  FLEETS  LIST  DIST A N  SAVE  QUIT';
function drawStatus() { fillRow(24, 11, 1); put(24, 0, HINT.slice(0, COLS), 11, 1); }
function stopTicker() { if (tick) { clearInterval(tick); tick = null; } }
function startTicker(text) {
  stopTicker();
  if (reduceMotion) { fillRow(24, 14, 1); put(24, 1, text, 14, 1); setTimeout(() => { if (gameScreen && !tick) drawStatus(); }, 6000); return; }
  let off = COLS;
  tick = setInterval(() => {
    if (!gameScreen) { stopTicker(); return; }
    fillRow(24, 14, 1); put(24, off, text, 14, 1); off--;
    if (off < -text.length) { stopTicker(); drawStatus(); }
  }, 85);
}

function cDist(a, b) {
  const A = pl(a), B = pl(b);
  if (!A || !B) { msg(`There is no planet ${!A ? a : b}.`); return; }
  const d = dist(A, B), t = travel(d);
  msg(`${a} to ${b}: ${d.toFixed(1)} light years, ${t} turn${t > 1 ? 's' : ''} of travel.`);
}
async function cHumanTurn(pi) {
  const me = S.players[pi], P = PCOL[pi];
  drawGame(pi);
  msg(turnNote ? [[turnNote, 10]] : [[me.name, P], [', enter your moves. Enter by itself ends your turn.', 7]]);
  if (rnd() < 0.18) startTicker('Look to Carol Alt for inspiration');
  while (true) {
    const raw = await ask([[me.name, P], [', from planet? ', 15]], 12);
    const s = raw.toUpperCase().replace(/\s+/g, ' ').trim();
    if (s === '') return 'done';
    if (s === '?' || s === 'HELP') { await cHelp(); drawGame(pi); continue; }
    if (/^\? ?[A-Z]$/.test(s)) { cInfo(pi, s.slice(-1)); continue; }
    if (s === 'FLEETS') { await cFleets(pi); drawGame(pi); continue; }
    if (s === 'LIST') { await cList(pi); drawGame(pi); continue; }
    if (s === 'MODERN') { setMode('modern'); throw new SwitchError(); }
    if (s === 'SAVE') { S.cur = pi; save(); msg('Game saved. It will be offered to you when you come back.'); continue; }
    if (s === 'QUIT') {
      const a = await ask([['Quit to the title screen? The game is saved. (Y/N) ', 15]], 1);
      if (a.toUpperCase() === 'Y') return 'quit';
      msg(''); continue;
    }
    if (s === 'ORDERS') { await cOrders(pi); drawGame(pi); continue; }
    let m = s.match(/^DIST ?([A-Z]) ?([A-Z])$/);
    if (m) { cDist(m[1], m[2]); continue; }
    m = s.match(/^STOP ?([A-Z]) ?([A-Z])$/);
    if (m) {
      const before = S.standing.length;
      S.standing = S.standing.filter(o => !(o.owner === pi && o.from === m[1] && o.to === m[2]));
      msg(S.standing.length < before ? `Standing order from ${m[1]} to ${m[2]} cancelled.` : `You have no standing order from ${m[1]} to ${m[2]}.`);
      continue;
    }
    let from, to = null, count = null, repeat = false;
    m = s.match(/^([A-Z]) ?([A-Z])(?: ?(\d+))?( ?\*)?$/);
    if (m) { from = m[1]; to = m[2]; if (m[3] != null) count = parseInt(m[3], 10); repeat = !!m[4] && m[3] != null; }
    else if (/^[A-Z]$/.test(s)) from = s;
    else { msg([['Unknown command. Type ? for help.', 12]]); continue; }

    const F = pl(from);
    if (!F) { msg(`There is no planet ${from}.`); continue; }
    if (F.owner !== pi) { msg(`Planet ${from} is not yours.`); continue; }
    if (F.ships <= 0) { msg(`Planet ${from} has no ships to send.`); continue; }
    cDrawMap({ hl: from });
    if (!to) {
      msg([[`Planet ${from} has ${F.ships} ships ready. `, 7], ['Enter by itself cancels.', 8]]);
      to = (await ask([['To planet? ', 15]], 2)).toUpperCase().trim();
      if (!to) { msg('Move cancelled.'); cDrawMap(); continue; }
    }
    const T = pl(to);
    if (!T) { msg(`There is no planet ${to}.`); cDrawMap(); continue; }
    if (T === F) { msg('A fleet has to fly to a different planet.'); cDrawMap(); continue; }
    const d = dist(F, T), tt = travel(d);
    if (count == null) {
      msg(`${F.name} to ${T.name}: ${d.toFixed(1)} light years. The fleet would arrive on turn ${S.turn + tt}.`);
      while (true) {
        const a = await ask([[`Ships to send (0-${F.ships}, add * to repeat every turn)? `, 15]], 6);
        if (a === '') { count = 0; break; }
        const am = a.replace(/\s+/g, '').match(/^(\d+)(\*)?$/);
        if (!am) { msg('Redo from start'); continue; }
        const n = parseInt(am[1], 10); repeat = !!am[2];
        if (n > F.ships) { msg(`Planet ${F.name} has only ${F.ships} ships.`); continue; }
        count = n; break;
      }
    } else if (count > F.ships) { msg(`Planet ${F.name} has only ${F.ships} ships.`); cDrawMap(); continue; }
    if (count <= 0) { msg('Move cancelled.'); cDrawMap(); continue; }
    launch(pi, F, T, count);
    if (repeat) addStanding(pi, F, T, count);
    msg([[`${count} ship${count > 1 ? 's' : ''} launched from ${F.name} to ${T.name}. Arrival on turn ${S.turn + tt}.${repeat ? ' Repeats every turn.' : ''}`, 10]]);
    cDrawMap(); cDrawPanel(pi);
  }
}

async function askNum(prompt, min, max, def) {
  while (true) {
    const s = await input(prompt, { max: 4 });
    if (s === '') return def;
    if (!/^-?\d+$/.test(s)) { println('Redo from start', 7); continue; }
    const n = parseInt(s, 10);
    if (n < min || n > max) { println(` Please enter a number from ${min} to ${max}.`, 7); continue; }
    return n;
  }
}
async function askYN(prompt, def) {
  while (true) {
    const s = (await input(prompt, { max: 3 })).toUpperCase();
    if (s === '') return def;
    if (s[0] === 'Y') return true;
    if (s[0] === 'N') return false;
    println(' Please answer Y or N.', 7);
  }
}

mapCv.addEventListener('pointerleave', () => { V.hover = null; tip.hidden = true; });

function mKeydown(e) {
  const typing = e.target && (e.target.tagName === 'INPUT' && e.target.type !== 'radio' && e.target.type !== 'checkbox');
  if (rtActive() && !typing && overlay.hidden && $('#helpOverlay').hidden && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); rtPause(!RT.paused); return; }
    if (/^[1-4]$/.test(e.key)) { V.sendPct = [25, 50, 75, 100][+e.key - 1]; renderRTSide(); return; }
    if (e.key === 'a' || e.key === 'A') { V.rtSel = new Set(S.planets.filter(p => p.owner === V.pi).map(p => p.name)); renderRTSide(); return; }

  if (!$('#helpOverlay').hidden) { closeHelp(); return; }
  if (V.drag) { V.drag = null; V.down = null; return; }
  if (myTurn() && (V.sel || V.target || V.focus)) { V.sel = V.target = V.focus = null; refresh(); }
}

async function mTitle() {
  prepModern(); setAccent(-1);

  const saved = loadSave();
  const res = await mWait(done => {
    openDialog(setupHTML(saved), '');
    dialog.oninput = e => {
      const t = e.target;
      if (t.id === 'nNeutral') $('#nnOut').textContent = t.value;
      if (t.id === 'nTurns') $('#ntOut').textContent = t.value;
      if (/^pai\d$/.test(t.id)) { const sel = $('#pstyle' + t.id.slice(3)); if (sel) sel.disabled = !t.checked; }
      if (t.name === 'gtype' || t.name === 'speed') { readSetup(); dialog.innerHTML = setupHTML(saved); const f = $(`#${t.name}-${t.value}`); if (f) f.focus({ preventScroll: true }); }
    };
    dialog.onclick = e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const act = b.dataset.act;
      if (act === 'resume') { done('resume'); return; }
      if (act === 'np-' || act === 'np+') {
        readSetup();
        const s = setupState;
        s.np = Math.max(2, Math.min(6, s.np + (act === 'np+' ? 1 : -1)));
        while (s.players.length < s.np) s.players.push({ name: `PLAYER ${s.players.length + 1}`, ai: true, style: 'mixed' });
        s.neutral = Math.min(s.neutral, 26 - s.np);
        dialog.innerHTML = setupHTML(saved);
      }
    };
    dialog.onsubmit = e => {
      e.preventDefault(); readSetup();
      const s = setupState, players = [];
      const rt = s.gtype === 'realtime';
      for (let i = 0; i < s.np; i++) players.push({ name: cleanName(s.players[i].name, i, players.map(p => p.name)), ai: rt ? i > 0 : s.players[i].ai, style: s.players[i].style || 'mixed', alive: true });
      if (players.every(p => p.ai)) players[0].ai = false;
      s.players.forEach((p, i) => { if (players[i]) { p.name = players[i].name; if (!rt) p.ai = players[i].ai; } });
      done({ players, neutral: Math.min(s.neutral, 26 - s.np), turns: s.turns, revolts: s.revolts, scouting: s.scouting, shape: s.shape, skill: s.skill, realtime: rt, speed: s.speed });
    };
  });
  closeDialog();
  if (res === 'resume') { S = normalize(saved); return; }
  newGame(res.players, res);
  sprites.clear();
  V.hidePlanets = false; V.pi = -1; showSide(true); setTop();
  while (true) {
    previewSide();
    const a = await mWait(done => { side.onclick = e => { const b = e.target.closest('[data-act]'); if (b) done(b.dataset.act); }; });
    side.onclick = null;
    if (a === 'begin') break;
    reroll(); sprites.clear();
  }
}

        : `<p class="muted small">${mine.length ? 'No fleets yet. Drag from one of your planets to another planet.' : 'You hold no planets. Your fleets in flight are all that remain.'}</p>`}</section>
    ${standing.length ? `<section><h3>Standing orders <span class="count">${standing.length}</span></h3><ul class="list">${standing.map(o => `<li><span class="eta">EACH</span><span class="n">${o.ships}</span> ${plTag(o.from)} → ${plTag(o.to)}<button type="button" class="ghost x" data-stop="${o.id}" aria-label="Stop the standing order from ${o.from} to ${o.to}">Stop</button></li>`).join('')}</ul></section>` : ''}
    <section><h3>In flight <span class="count">${flying.length}</span></h3>
      ${flying.length ? `<ul class="list">${flying.map(f => `<li>${fl(f)}</li>`).join('')}</ul>` : '<p class="muted small">Nothing in transit.</p>'}</section>
    <section><h3>Your planets <span class="count">${mine.length}</span></h3>
      <table class="ptable"><thead><tr><th>Planet</th><th>Ships</th><th>Prod</th><th>Kill</th></tr></thead><tbody>
      ${mine.map(p => `<tr data-sel="${p.name}"><td>${plTag(p.name)}${p.home === pi ? '<span class="home">home</span>' : ''}</td><td>${p.ships}</td><td>${p.prod}</td><td>${kfmt(p.kill)}</td></tr>`).join('')}
      </tbody></table></section>
    <footer class="sidefoot"><button type="button" class="ghost" data-act="quit">Save &amp; quit</button><button type="button" class="primary" data-act="end" id="endTurn">End turn ${S.turn}</button></footer>`;
}
function fb(text, bad = false) { V.fb = text; V.fbBad = bad; const el = $('#cmdFb'); if (el) { el.textContent = text; el.classList.toggle('bad', bad); } }
function doLaunch(n) {
  const F = V.sel, T = V.target; if (!F || !T) return;
  n = Math.max(1, Math.min(F.ships, n | 0));
  launch(V.pi, F, T, n);
  if (V.repeat) addStanding(V.pi, F, T, n);
  fb(`${n} ship${n > 1 ? 's' : ''} launched from ${F.name} to ${T.name}. Arrival on turn ${S.turn + travel(dist(F, T))}.${V.repeat ? ' The order repeats every turn.' : ''}`);
  V.target = null; V.count = null; V.repeat = false;
  if (F.ships <= 0) V.sel = null;
  renderTurnSide();
}
function execCmd(raw) {
  const s = raw.toUpperCase().replace(/\s+/g, ' ').trim();
  if (!s) return;
  let m;
  if (s === '?' || s === 'HELP') { openHelp(); return; }
  if (s === 'CLASSIC') { setMode('classic'); return; }
  if ((m = s.match(/^\? ?([A-Z])$/))) { const p = pl(m[1]); if (!p) return fb(`There is no planet ${m[1]}.`, true); V.focus = p; V.sel = V.target = null; V.fb = ''; renderTurnSide(); return; }
  if ((m = s.match(/^DIST ?([A-Z]) ?([A-Z])$/))) {
    const A = pl(m[1]), B = pl(m[2]); if (!A || !B) return fb(`There is no planet ${!A ? m[1] : m[2]}.`, true);
    const d = dist(A, B), t = travel(d); return fb(`${A.name} to ${B.name}: ${d.toFixed(1)} light years, ${t} turn${t > 1 ? 's' : ''} of travel.`);
  }
  if ((m = s.match(/^STOP ?([A-Z]) ?([A-Z])$/))) {
    const before = S.standing.length;
    S.standing = S.standing.filter(o => !(o.owner === V.pi && o.from === m[1] && o.to === m[2]));
    renderTurnSide();
    return fb(S.standing.length < before ? `Standing order from ${m[1]} to ${m[2]} cancelled.` : `You have no standing order from ${m[1]} to ${m[2]}.`, S.standing.length === before);
  }
  if ((m = s.match(/^([A-Z])(?: ?([A-Z]))?(?: ?(\d+|ALL))?( ?\*)?$/))) {
    const F = pl(m[1]);
    if (!F) return fb(`There is no planet ${m[1]}.`, true);
    if (F.owner !== V.pi) return fb(`Planet ${F.name} is not yours.`, true);
    if (F.ships <= 0) return fb(`Planet ${F.name} has no ships to send.`, true);
    if (!m[2]) { V.sel = F; V.target = null; V.focus = null; V.fb = ''; renderTurnSide(); return; }
    const T = pl(m[2]);
    if (!T) return fb(`There is no planet ${m[2]}.`, true);
    if (T === F) return fb('A fleet has to fly to a different planet.', true);
    V.sel = F; V.target = T; V.focus = null;
    if (m[3]) {
      const n = m[3] === 'ALL' ? F.ships : parseInt(m[3], 10);
      if (n > F.ships) { V.count = F.ships; renderTurnSide(); return fb(`Planet ${F.name} has only ${F.ships} ships.`, true); }
      if (n <= 0) return fb('Send at least one ship.', true);
      V.repeat = !!m[4]; doLaunch(n); return;
    }
    V.count = null; V.fb = ''; renderTurnSide(); return;
  }
  fb('Unknown order. Try AN 25, AN ALL, ?N or DIST A N.', true);
}
side.addEventListener('click', e => {
  if (rtActive()) {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'pause') rtPause(!RT.paused);
    else if (b.dataset.act === 'rtquit') rtConfirmQuit();
    return;
  }
  if (!myTurn()) return;
  const t = e.target;
  const u = t.closest('[data-undo]');
  if (u) {
    const id = +u.dataset.undo, i = S.fleets.findIndex(f => f.id === id);
    if (i >= 0) { const f = S.fleets[i]; pl(f.from).ships += f.ships; S.fleets.splice(i, 1); fb(`Fleet from ${f.from} to ${f.to} recalled. ${f.ships} ships returned.`); }
    renderTurnSide(); return;
  }
  const st = t.closest('[data-stop]');
  if (st) {
    const id = +st.dataset.stop, o = S.standing.find(x => x.id === id);
    S.standing = S.standing.filter(x => x.id !== id);
    if (o) fb(`Standing order from ${o.from} to ${o.to} stopped. Fleets already launched keep flying.`);
    renderTurnSide(); return;
  }
  const q = t.closest('[data-pct]');
  if (q && V.sel) { V.count = Math.max(1, Math.round(V.sel.ships * (+q.dataset.pct) / 100)); syncCount(); return; }
  const row = t.closest('[data-sel]');
  if (row) { const p = pl(row.dataset.sel); if (p.ships > 0) { V.sel = p; V.target = null; V.focus = null; } else V.focus = p; renderTurnSide(); return; }
  const b = t.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'cancelSel') { V.sel = V.target = null; renderTurnSide(); }
  else if (act === 'cancelOrder') { V.target = null; renderTurnSide(); }
  else if (act === 'launch') doLaunch(V.count);
  else if (act === 'end') { const f = M.flow; V.sel = V.target = V.focus = null; f.done('done'); }
  else if (act === 'quit') confirmQuit();
});
function syncCount() {
  const n = V.count, r = $('#shipRange'), k = $('#shipNum'), b = $('#launchBtn');
  if (r) r.value = n; if (k) k.value = n; if (b) b.textContent = `Launch ${n} ship${n > 1 ? 's' : ''}`;
}
side.addEventListener('input', e => {
  if (rtActive()) {
    if (e.target.name === 'pct') { V.sendPct = +e.target.value; rtLive(); }
    if (e.target.name === 'speed') { S.speed = e.target.value; RT.last = null; save(); }
    return;
  }
  if (e.target.id === 'repeatChk') { V.repeat = e.target.checked; return; }
  if (!V.sel) return;
  if (e.target.id === 'shipRange' || e.target.id === 'shipNum') {
    const v = parseInt(e.target.value, 10);
    if (Number.isFinite(v)) { V.count = Math.max(1, Math.min(V.sel.ships, v)); if (e.target.id === 'shipRange') syncCount(); else { const r = $('#shipRange'), b = $('#launchBtn'); if (r) r.value = V.count; if (b) b.textContent = `Launch ${V.count} ship${V.count > 1 ? 's' : ''}`; } }
  }
});
side.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'cmdInput') { e.preventDefault(); const v = e.target.value; e.target.value = ''; execCmd(v); const c = $('#cmdInput'); if (c) c.focus({ preventScroll: true }); }
  else if (e.target.id === 'shipNum' || e.target.id === 'shipRange') { e.preventDefault(); doLaunch(V.count); }
});
function confirmQuit() {
  const f = M.flow;
  openDialog(`<h2>Save and quit?</h2><p class="muted">Your game is saved at turn ${S.turn}, including this turn's launches. Resume it from the title screen whenever you like.</p>
    <div class="row"><button type="button" class="ghost" data-act="stay">Keep playing</button><button type="button" class="primary" data-act="quit">Save &amp; quit</button></div>`);
  dialog.onclick = e => { const b = e.target.closest('[data-act]'); if (!b) return; closeDialog(); if (b.dataset.act === 'quit' && M.flow === f) f.done('quit'); };
}
async function mHumanTurn(pi) {
  prepModern();
  V.pi = pi; V.hidePlanets = false; showSide(true); setAccent(pi); setTop();
  if (turnNote) V.fb = turnNote;
  if (rnd() < 0.18 && !reduceMotion) { const tk = $('#ticker'); tk.hidden = false; const sp = tk.firstElementChild; sp.style.animation = 'none'; void sp.offsetWidth; sp.style.animation = ''; sp.onanimationend = () => { tk.hidden = true; }; }
  const r = await mWait(done => { M.flow = { kind: 'turn', pi, done }; renderTurnSide(); });
  M.flow = null;
  return r;
}

/* ---------- between turns ---------- */
async function mHandoff(pi) {
  prepModern();
  V.pi = -1; V.hidePlanets = false; showSide(true); setAccent(pi); setTop();
  side.innerHTML = `<section><h2>Waiting for ${chip(pi)}</h2><p class="muted small">Fleets and garrisons stay hidden until ${esc(S.players[pi].name)} takes the controls.</p></section>`;
  await mWait(done => {
    openDialog(`<p class="eyebrow">Turn ${S.turn}</p><h2>${chip(pi)}, it's your move</h2><p class="muted">Everyone else, look away from the screen.</p>
      <div class="row"><button type="button" class="primary" data-act="ok" autofocus>I'm ready</button></div>`);
    dialog.onclick = e => { if (e.target.closest('[data-act="ok"]')) done(); };
  });
  closeDialog();
}
function standingsHTML() {
  const items = S.players.map((p, i) => p.alive ? `<span>${chip(i)} ${S.planets.filter(x => x.owner === i).length}</span>` : '').filter(Boolean);
  items.push(`<span>Neutral ${S.planets.filter(x => x.owner < 0).length}</span>`);
  return `<div class="standings"><span class="eyebrow">Planets held</span>${items.join('')}</div>`;
}
async function mNews(news, snap) {
  prepModern();
  const solo = soleHuman();
  V.pi = solo; V.hidePlanets = false; showSide(true); setAccent(-1); setTop();
  side.innerHTML = `<section><h2>Turn ${S.turn - 1} resolves</h2><p class="muted small">Fleets are arriving. Click the map to skip ahead.</p></section><section>${standingsHTML()}</section>`;
  if (snap && !reduceMotion) {
    const oldT = snap.turn, newT = S.turn;
    const items = snap.fleets.filter(f => f.arrive <= newT || f.owner === solo).map(f => ({ f, p0: fleetT(f, oldT), p1: f.arrive <= newT ? 1 : fleetT(f, newT), arrives: f.arrive <= newT, col: MPC[f.owner] }));
    const switchAt = {}, flashes = [], hitT = 0.72;
    for (const ev of lastEvents) {
      if (ev.kind === 'battle') { if (!switchAt[ev.planet]) switchAt[ev.planet] = { t: hitT, before: snap.owners[ev.planet] }; flashes.push({ name: ev.planet, t: hitT, col: MPC[ev.attacker], big: ev.captured }); }
      else { if (!switchAt[ev.planet]) switchAt[ev.planet] = { t: 0.9, before: ev.before }; flashes.push({ name: ev.planet, t: 0.9, col: '#ffffff', big: ev.success }); }
    }
    if (items.length || flashes.length) {
      await mWait(done => { V.replay = { start: performance.now(), dur: 1700, hit: hitT, items, switchAt, flashes, onDone: done }; });
      V.replay = null;
    }
  }
  const list = news.length ? `<ul class="news">${news.map(it => `<li${it[0][3] === 'banner' ? ' class="banner"' : ''}>${segHTML(it)}</li>`).join('')}</ul>` : '<p class="muted">All quiet across the galaxy.</p>';
  await mWait(done => {
    openDialog(`<p class="eyebrow">Start of turn ${S.turn}</p><h2>Galactic news</h2>${list}${standingsHTML()}
      <div class="row"><button type="button" class="primary" data-act="ok" autofocus>Continue</button></div>`, 'wide');
    dialog.onclick = e => { if (e.target.closest('[data-act="ok"]')) done(); };
  });
  closeDialog();
}
async function mMoreTurns() {
  prepModern(); V.pi = -1; V.hidePlanets = false; setTop();
  const r = await mWait(done => {
    openDialog(`<p class="eyebrow">Turn limit reached</p><h2>All ${S.maxTurns} turns have been played</h2><p class="muted">Keep the war going, or count up the scores.</p>
      <div class="field"><label for="moreN">Turns to add <output id="moreOut">10</output></label><input type="range" id="moreN" min="1" max="99" value="10"></div>
      <div class="row"><button type="button" class="ghost" data-act="end">End the game</button><button type="button" class="primary" data-act="add">Add turns</button></div>`);
    dialog.oninput = e => { if (e.target.id === 'moreN') $('#moreOut').textContent = e.target.value; };
    dialog.onclick = e => { const b = e.target.closest('[data-act]'); if (!b) return; done(b.dataset.act === 'add' ? +$('#moreN').value : 0); };
  });
  closeDialog();
  if (!r) return false;
  S.maxTurns += r; save(); return true;
}
async function mGameOver(reason) {
  clearSave();
  prepModern(); V.pi = -1; V.hidePlanets = false; V.reveal = true; setAccent(-1); setTop();
  const rows = finalRows(), w = rows[0];
  side.innerHTML = `<section><h2>Final map</h2><p class="muted small">Every garrison is revealed. ${esc(reason)}</p></section><section>${standingsHTML()}</section>`;
  await mWait(done => {
    openDialog(`<p class="eyebrow">${esc(reason)}</p><h2>${chip(w.i)} rules the galaxy</h2>
      <table class="final"><thead><tr><th>Empire</th><th>Planets</th><th>Ships</th><th>Avg kill</th><th>Score</th>${anyAI() ? '<th>Played as</th>' : ''}</tr></thead><tbody>
      ${rows.map(r => `<tr><td>${chip(r.i)}</td><td>${r.planets}</td><td>${r.ships}</td><td>${kfmt(r.avgK)}</td><td class="score">${r.score}</td>${anyAI() ? `<td>${r.p.ai ? AI_STYLES[styleKey(r.p)].label : 'Human'}</td>` : ''}</tr>`).join('')}
      </tbody></table><p class="muted small">Score is ships × average kill + 50 per planet.</p>
      <div class="row"><button type="button" class="ghost" data-act="map">See the map</button><button type="button" class="primary" data-act="ok" autofocus>Back to title</button></div>`, 'wide');
    dialog.onclick = e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'ok') done();
      else { overlay.hidden = true; side.insertAdjacentHTML('beforeend', `<footer class="sidefoot"><button type="button" class="primary" id="backTitle">Back to title</button></footer>`); $('#backTitle').onclick = () => done(); }
    };
  });
  closeDialog(); V.reveal = false;
}
/* ---------- real time ---------- */
function rtSendCount(names, T) {
  return names.reduce((a, n) => { const F = pl(n); return F && F !== T && F.owner === V.pi ? a + Math.floor(F.ships * V.sendPct / 100) : a; }, 0);
}
function rtSend(names, T) {
  let fleets = 0, ships = 0;
  for (const n of names) {
    const F = pl(n);
    if (!F || F === T || F.owner !== V.pi) continue;
    const k = Math.floor(F.ships * V.sendPct / 100);
    if (k >= 1) { launch(V.pi, F, T, k); fleets++; ships += k; }
  }
  if (fleets) rtLog([[`You sent ${ships} ship${ships > 1 ? 's' : ''} in ${fleets} fleet${fleets > 1 ? 's' : ''} to `, 7], plSeg(T.name), ['.', 7]], true);
}
function rtClick(p) {
  if (!p) { V.rtSel.clear(); V.focus = null; }
  else if (p.owner === V.pi) { if (V.rtSel.has(p.name)) V.rtSel.delete(p.name); else V.rtSel.add(p.name); V.focus = null; }
  else if (V.rtSel.size) rtSend([...V.rtSel], p);
  else V.focus = p;
  renderRTSide();
}
function rtPause(on) {
  RT.paused = on; RT.last = null;
  if (on) save();
  const b = $('#pauseBtn'); if (b) b.textContent = on ? 'Resume' : 'Pause';
}
function rtLog(item, mine = false) {
  RT.events.unshift({ day: Math.floor(S.cyc) + 1, item, mine });
  RT.events.length = Math.min(RT.events.length, 40);
  renderRTSide();
}
function rtNews(news, now) {
  for (const ev of lastEvents) V.fx.push({ name: ev.planet, t0: now, col: ev.kind === 'battle' ? MPC[ev.attacker] : '#ffffff', big: ev.kind === 'battle' ? ev.captured : ev.success });
  for (const it of news) RT.events.unshift({ day: Math.floor(S.cyc) + 1, item: it });
  RT.events.length = Math.min(RT.events.length, 40);
  renderRTSide();
}
function rtLive() {
  const el = $('#rtLive'); if (!el || !S) return;
  const mine = S.planets.filter(p => p.owner === V.pi);
  const ships = Math.floor(mine.reduce((a, p) => a + p.ships, 0) + S.fleets.filter(f => f.owner === V.pi).reduce((a, f) => a + f.ships, 0));
  el.textContent = `Day ${Math.floor(S.cyc) + 1} · ${mine.length} planet${mine.length === 1 ? '' : 's'} · ${ships} ships`;
  $('#mTurn').textContent = `Real time · Day ${Math.floor(S.cyc) + 1}`;
  const sel = $('#rtSelInfo');
  if (sel) { const n = [...V.rtSel].filter(k => pl(k).owner === V.pi); sel.textContent = n.length ? `${n.length} selected · ${rtSendCount(n, null)} ships at ${V.sendPct === 100 ? 'all' : V.sendPct + '%'}` : 'Nothing selected'; }
}
function renderRTSide() {
  if (!rtActive()) return;
  for (const k of [...V.rtSel]) if (pl(k).owner !== V.pi) V.rtSel.delete(k);
  const pi = V.pi, me = S.players[pi];
  const emp = S.players.map((p, i) => p.alive ? `<li>${chip(i)}<span class="muted" style="margin-left:auto">${S.planets.filter(x => x.owner === i).length} planets</span></li>` : '').join('');
  const log = RT.events.slice(0, 12).map(e => `<li${e.item[0] && e.item[0][3] === 'banner' ? ' class="banner"' : ''}><span class="eta">D${e.day}</span> ${segHTML(e.item)}</li>`).join('');
  side.innerHTML = `
    <section class="who"><span class="dot"></span><div><div class="who-name">${esc(me.name)}</div><div class="muted small" id="rtLive"></div></div></section>
    <section><h3>Send strength</h3>${choices('pct', { 25: '25%', 50: '50%', 75: '75%', 100: 'All' }, String(V.sendPct))}
      <p class="muted small" id="rtSelInfo"></p>
      <p class="hint">Click your planets to select them (A selects all), then click a target. Or drag from one planet to another. Keys 1 to 4 set strength; Space pauses.</p></section>
    ${V.focus ? intelHTML(V.focus) : ''}
    <section><h3>Speed</h3>${choices('speed', { slow: 'Slow', normal: 'Normal', fast: 'Fast' }, S.speed)}</section>
    <section><h3>Empires</h3><ul class="list">${emp}</ul></section>
    <section><h3>Battle log</h3>${log ? `<ul class="list rtlog">${log}</ul>` : '<p class="muted small">No battles yet.</p>'}</section>
    <footer class="sidefoot"><button type="button" class="ghost" data-act="rtquit">Save &amp; quit</button><button type="button" class="primary" data-act="pause" id="pauseBtn">${RT.paused ? 'Resume' : 'Pause'}</button></footer>`;
  rtLive();
}
async function mRealtime() {
  prepModern();
  V.pi = S.players.findIndex(p => !p.ai); V.hidePlanets = false; V.rtSel = new Set(); V.fx = [];
  showSide(true); setAccent(V.pi);
  if (RT.gameSeed !== S.seed) { RT.events = []; RT.gameSeed = S.seed; }
  RT.on = true; RT.paused = false; RT.last = null; RT.saved = performance.now();
  renderRTSide();
  try {
    return await new Promise((res, rej) => {
      pendingReject = e => { RT.on = false; RT.finish = null; rej(e); };
      RT.finish = v => { RT.on = false; RT.finish = null; pendingReject = null; save(); res(v); };
    });
  } finally { RT.on = false; }
}
function rtConfirmQuit() {
  const was = RT.paused; rtPause(true);
  openDialog(`<h2>Save and quit?</h2><p class="muted">The galaxy is saved on day ${Math.floor(S.cyc) + 1}. Resume it from the title screen whenever you like.</p>
    <div class="row"><button type="button" class="ghost" data-act="stay">Keep playing</button><button type="button" class="primary" data-act="quit">Save &amp; quit</button></div>`);
  dialog.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    closeDialog();
    if (b.dataset.act === 'quit') RT.finish && RT.finish({ over: false });
    else rtPause(was);
  };
}

const MUI = { realtime: mRealtime, title: mTitle, humanTurn: mHumanTurn, news: mNews, handoff: mHandoff, moreTurns: mMoreTurns, gameOver: mGameOver };

/* =====================================================================
   GAME LOOP
   ===================================================================== */
async function playGame() {
  if (S.realtime) {
    const r = await run('realtime');
    if (r && r.over) await run('gameOver', r.reason);
    return;
  }
  while (true) {
    const humans = S.players.filter(p => p.alive && !p.ai).length;
    for (let pi = S.cur; pi < S.players.length; pi++) {
      const p = S.players[pi];
      if (!p.alive) continue;
      S.cur = pi; save();
      if (p.ai) { aiTurn(pi); continue; }
      turnNote = execStanding(pi);
      if (humans > 1) await run('handoff', pi);
      if ((await run('humanTurn', pi)) === 'quit') { S.cur = pi; save(); return; }
    }
    S.cur = 0;
    const snap = snapshot();
    const news = resolve();
    save();
    await run('news', news, snap);
    if (S.players.filter(p => p.alive).length <= 1) { await run('gameOver', 'Only one empire remains.'); return; }
    if (!S.players.some(p => p.alive && !p.ai)) { await run('gameOver', 'No human empire remains.'); return; }
    if (S.turn > S.maxTurns && !(await run('moreTurns'))) { await run('gameOver', `All ${S.maxTurns} turns have been played.`); return; }
  }
}
async function main() { while (true) { await run('title'); await playGame(); } }

window.__galcon = { genUniverse, aiTurn, resolve, fight, snapshot, rtStep, RT, newGame, setState: s => { S = s; }, getState: () => S };
loadArt();
applyMode();
let started = false;
function start() { if (started) return; started = true; main(); }
try { document.fonts.load(FONT).then(() => { dirty(); start(); }, start); } catch (e) { start(); }
setTimeout(start, 1200);
try { document.fonts.ready.then(() => { dirty(); bgCache = null; }); } catch (e) {}
})();
