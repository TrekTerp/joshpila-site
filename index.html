<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Josh Pila</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--ground:#EFE6CF;--panel:#FBF6E8;--ink:#2B2418;--ink-2:#5A4E3A;--muted:#7C6E56;--line:#CDBF9E;--accent:#2C6D64;--brass:#96762F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#F6EED9 0%,var(--ground) 60%,#E2D5B4 100%);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;display:flex;flex-direction:column;align-items:center;padding:56px 16px 40px}
main{width:min(760px,100%)}
h1{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,52px);margin:0 0 4px;letter-spacing:.01em}
.sub{font-family:"IM Fell English",Georgia,serif;font-style:italic;color:var(--ink-2);font-size:19px;margin:0 0 30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px 22px;
  box-shadow:0 1px 2px rgba(60,45,20,.08),0 10px 28px rgba(60,45,20,.10);transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(60,45,20,.1),0 14px 34px rgba(60,45,20,.16)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card h2{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:25px;margin:0 0 6px;color:var(--accent)}
.card p{margin:0;color:var(--ink-2);font-size:15px}
.card .go{display:inline-block;margin-top:14px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass)}
.note{margin-top:34px;color:var(--muted);font-size:13.5px}
.note a{color:var(--accent)}
</style></head><body><main>

<h1>Josh Pila</h1>
<p class="sub">Placeholder home page</p>
<div class="cards"><a class="card" href="dnd/"><h2>Dragon's Bane</h2><p>Our D&amp;D campaign: the Codex and the party’s bastion.</p><span class="go">Enter →</span></a></div>

</main></body></html>
